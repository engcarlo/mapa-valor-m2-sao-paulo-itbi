[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapa-valor-m2-sao-paulo-itbi"
version = "0.1.0"
description = "Valor do m² de apartamentos em São Paulo por distrito e padrão construtivo a partir de dados abertos de ITBI, com camada de ML e validação temporal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Carlo Yukio Nunes" }]
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "openpyxl>=3.1",
  "pyarrow>=14", "shapely>=2.0", "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
itbi-sp = "itbi_sp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
itbi_sp = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
